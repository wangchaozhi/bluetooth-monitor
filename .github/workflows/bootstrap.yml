name: Bootstrap source import

on:
  push:
    branches:
      - main
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Restore bluetooth-monitor v0.7.0
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/c* > /tmp/source.b64
          base64 --decode /tmp/source.b64 > /tmp/source.zip
          echo "1025ebef950baa57a54eed358cc7a21ac4749a99256209bce8e3d51f9d057a9f  /tmp/source.zip" | sha256sum --check -
          rm -rf /tmp/unpack
          mkdir -p /tmp/unpack
          unzip -q /tmp/source.zip -d /tmp/unpack
          root="$(find /tmp/unpack -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -f "$root/Cargo.toml"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$root"/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: import bluetooth-monitor v0.7.0"
          git push origin HEAD:main
