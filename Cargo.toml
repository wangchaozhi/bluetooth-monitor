[package]
name = "bluetooth-monitor"
version = "0.7.0"
edition = "2024"
rust-version = "1.98.1"
description = "Cross-platform Bluetooth LE GATT data monitor"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "=1.0.104"
btleplug = "=0.13.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
csv = "=1.4.0"
crc = "=3.4.0"
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "default_fonts", "persistence", "wgpu", "wayland", "x11"] }
egui_plot = "=0.37.0"
futures = "=0.3.34"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
uuid = "=1.26.1"

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
rfd = { version = "=0.17.2", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
